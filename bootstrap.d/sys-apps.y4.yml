    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      # Remove items installed by util-linux-libs
      - args: ['rm', '-r', '@THIS_COLLECT_DIR@/usr/include']
      - args: ['rm', '-r', '@THIS_COLLECT_DIR@/usr/lib']

  - name: which
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    source:
      subdir: ports
      url: 'https://ftp.fau.de/gnu/which/which-2.21.tar.gz'
      format: 'tar.gz'
      checksum: blake2b:355888b0dfe3e4e1679a8a9e1255a935fa48be220408abc441fae69fe0b26bd39e0544ed20e75497ed5bccaa75e788d9aec17007c668f15eaf6b1599faa131a0
      extract_path: 'which-2.21'
      version: '2.21'
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 13
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: xbps
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: The X Binary Package System (XBPS)
      description: This package provides the XBPS package manager.
      spdx: 'MIT'
      website: 'https://voidlinux.org/xbps/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://github.com/void-linux/xbps.git'
      tag: '0.59.2'
      version: '0.59.2.1'
      tools_required:
        - host-pkg-config
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - libarchive
      - lz4
      - openssl
      - zlib
    revision: 9
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['mkdir', '-pv', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/sysinit.target.wants/']
      - args: ['cp', '-v', '@THIS_SOURCE_DIR@/xbps.service', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/']
      - args: ['ln', '-svn', '../xbps.service', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/sysinit.target.wants/']

  - name: kmscon
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    default: true
    metadata:
      summary: Terminal emulator based on KMS/DRM
      description: Kmscon is a simple KMS/DRM based terminal emulator.
      spdx: 'MIT'
      website: 'https://github.com/Aetf/kmscon'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: 'ports'
      git: 'https://github.com/Aetf/kmscon.git'
      tag: 'v9.0.0'
      version: '9.0.0'
    tools_required:
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - libdrm
      - libtsm
      - libxkbcommon
      - systemd
    revision: 18
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr'
        - '--buildtype=debugoptimized'
        - '-Dsession_dummy=enabled'
        - '-Dsession_terminal=enabled'
        - '-Dmulti_seat=enabled'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/etc/kmscon']
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/kmscon.conf', '@THIS_COLLECT_DIR@/etc/kmscon/']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/kmscon.target.wants']
      - args: ['ln', '-svn', '../kmscon.service', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/kmscon.target.wants/']
      - args: ['cp', '@THIS_SOURCE_DIR@/kmscon.target', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/kmscon.target']

  - name: eudev
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    # API mismatch with systemd's udevd, hence unusable
    stability_level: broken
    source:
      subdir: 'ports'
      git: 'https://github.com/gentoo/eudev.git'
      tag: 'v3.2.11'
      version: '3.2.11'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.11
        - host-libtool
        - host-pkg-config
      regenerate:
        - args: ['./autogen.sh']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 5
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--with-sysroot=@SYSROOT_DIR@' # Set libtool's lt_sysroot.
        - '--disable-blkid'
        - '--disable-selinux'
        - '--disable-kmod'
        - '--disable-mtd-probe'
        - '--disable-rule-generator'
        - '--enable-introspection=no'
        - !managarm::arch_ite
          arch: [x86_64]
          # Disabled on all architectures for now
          then: '--enable-introspection=no'
          else: '--enable-introspection=no'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
      - args: ['touch', '@THIS_COLLECT_DIR@/usr/etc/udev/rules.d/.keep']

  - name: systemd
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: System and service manager for Linux and Managarm
      description: systemd is a suite of basic building blocks for a Linux system. It provides a system and service manager that runs as PID 1 and starts the rest of the system.
      spdx: 'GPL-2.0-only'
      website: 'https://systemd.io'
      maintainer: "no92 <leo@managarm.org> && Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
      replaces: ['eudev', 'systemd-utils']
    source:
      subdir: 'ports'
      git: 'https://github.com/systemd/systemd.git'
      tag: 'v259'
      version: '259'
    tools_required:
      - system-gcc
