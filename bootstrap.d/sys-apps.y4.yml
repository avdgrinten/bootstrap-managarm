!<tag:y4.managarm.org:preamble>
import:
  - !managarm
---
sources:
  - name: dtc
    subdir: 'ports'
    git: 'https://github.com/dgibson/dtc.git'
    tag: 'v1.7.2'
    version: '1.7.2'

  - name: file
    subdir: ports
    git: 'https://github.com/file/file.git'
    tag: 'FILE5_46'
    version: '5.46'
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.15
      - host-libtool
    regenerate:
      - args: ['autoreconf', '-f', '-i']

  - name: hwdata
    subdir: 'ports'
    git: 'https://github.com/vcrhonek/hwdata.git'
    tag: 'v0.391'
    version: '0.391'

  - name: util-linux
    subdir: ports
    git: 'https://git.kernel.org/pub/scm/utils/util-linux/util-linux.git'
    tag: 'v2.41.3'
    version: '2.41.3'

tools:
  - name: host-dtc
    labels: [aarch64, riscv64]
    architecture: noarch
    from_source: dtc
    tools_required:
      - host-pkg-config
      - virtual: pkgconfig-for-host
        program_name: host-pkg-config
    revision: 1
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--prefix=@PREFIX@'
        - '@THIS_SOURCE_DIR@'
    compile:
      - args: ['ninja']
    install:
      - args: ['ninja', 'install']

  - name: host-file
    labels: [aarch64, riscv64]
    architecture: noarch
    from_source: file
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.15
      - host-libtool
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--prefix=@PREFIX@'
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'install']

  - name: host-hwdata
    labels: [aarch64, riscv64]
    architecture: noarch
    from_source: hwdata
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
      - args:
        - '@THIS_BUILD_DIR@/configure'
        - '--prefix=@PREFIX@/usr'
        - '--libdir=@PREFIX@/lib'
        - '--datadir=@PREFIX@/share'
    install:
      - args: ['make', 'install']

packages:
  - name: bat
    stability_level: broken # rustix update
    architecture: '@OPTION:arch@'
    metadata:
      summary: cat clone with syntax highlighting and Git integration
      description: Bat is a cat clone with syntax highlighting and Git integration.
      spdx: 'Apache-2.0 BSD LGPL-3.0-or-later MIT'
      website: 'https://github.com/sharkdp/bat'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://github.com/sharkdp/bat.git'
      tag: 'v0.25.0'
      version: '0.25.0'
    tools_required:
      - host-cargo
      - system-gcc
    sources_required:
      - rust-patched-libs
    pkgs_required:
      - mlibc
    revision: 10
    configure:
      - args: ['@SOURCE_ROOT@/scripts/cargo-inject-patches.py', '@THIS_SOURCE_DIR@/Cargo.toml']
        isolate_network: false
    build:
      - args:
        - 'cargo'
        - 'install'
        - '--locked'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--path'
        - '@THIS_SOURCE_DIR@'
        - '--root'
        - '@THIS_COLLECT_DIR@/usr'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
        environ:
          CC: "@OPTION:arch-triple@-gcc"
        isolate_network: false
      - args: ['rm', '-v', '@THIS_COLLECT_DIR@/usr/.crates.toml']
      - args: ['rm', '-v', '@THIS_COLLECT_DIR@/usr/.crates2.json']

  - name: coreutils
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Standard GNU utilities (chmod, cp, dd, ls, sort, tr, head, wc, who,...)
      description: This package contains the basic utility programs needed by every operating system.
      spdx: 'GPL-3.0-or-later'
      website: 'https://www.gnu.org/software/coreutils/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: 'ports'
      url: 'https://ftp.nluug.nl/pub/gnu/coreutils/coreutils-9.6.tar.xz'
      format: tar.xz
      checksum: 'blake2b:4070d3d272851d3e9c326df9c05ce67797d86852e7f5c26e545f987f444295f2cfca24e8569514d7b5edf8fd50318d07cb20dea4a4ce8c65b34bea0c5a9177be'
      extract_path: 'coreutils-9.6'
      version: '9.6'
      tools_required:
        - host-automake-v1.15
      regenerate:
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/build-aux/']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 6
    configure:
      # Huge hack: coreutils does not compile the build-machine binary make-prime-list
      # using the build-machine compiler. Hence, build and invoke the binary manually here.
      - args:
        - '@THIS_SOURCE_DIR@/configure'
      - args: ['make', 'src/make-prime-list']
      - args: |
          ./src/make-prime-list 5000 > @THIS_SOURCE_DIR@/src/primes.h
      - args: ['make', 'clean']
      # Now compile coreutils for the correct target.
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--enable-no-install-program=kill,uptime'
        - '--enable-cross-guesses=risky'
        - '--with-included-regex'
        - 'CFLAGS=-Wno-error'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: dbus
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: A message bus system, a simple way for applications to talk to each other
      description: D-Bus is a message bus system, a simple way for applications to talk to one another. D-Bus supplies both a system daemon (for events such as "new hardware device added" or "printer queue changed") and a per-user-login-session daemon (for general IPC needs among user applications). Also, the message bus is built on top of a general one-to-one message passing framework, which can be used by any two applications to communicate directly (without going through the message bus daemon).
      spdx: 'GPL-2.0-only'
      website: 'https://www.freedesktop.org/wiki/Software/dbus/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://gitlab.freedesktop.org/dbus/dbus.git'
      tag: 'dbus-1.12.20'
      version: '1.12.20'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
        - host-libtool
        - host-autoconf-archive
      regenerate:
        - args: ['./autogen.sh']
          environ:
            NOCONFIGURE: 'yes'
    tools_required:
      - system-gcc
      - host-autoconf-v2.69
      - host-automake-v1.15
      - host-pkg-config
      - host-python
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - glib
      - libexpat
      - systemd
    revision: 15
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc'
        - '--localstatedir=/var'
        - '--disable-doxygen-docs'
        - '--disable-xml-docs'
        - '--disable-static'
        - '--enable-shared'
        - '--enable-verbose-mode'
        - '--docdir=/usr/share/doc/dbus-1.12.20'
        - '--with-console-auth-dir=/run/console'
        - '--with-system-pid-file=/run/dbus/pid'
        - '--with-system-socket=/run/dbus/system_bus_socket'
        - '--disable-selinux'
        - '--disable-apparmor'
        - '--disable-libaudit'
        - '--disable-kqueue'
        - '--disable-launchd'
        - '--enable-systemd'
        - '--disable-tests'
        - '--enable-user-session'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      # Touch up empty directories
      - args: ['touch',
          '@THIS_COLLECT_DIR@/usr/share/dbus-1/session.d/.keep',
          '@THIS_COLLECT_DIR@/var/lib/dbus/.keep'
        ]
      - args: ['rm', '-r', '@THIS_COLLECT_DIR@/var/run/']

  - name: diffutils
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Tools to make diffs and compare files
      description: This package contains programs that show the differences between files or directories.
      spdx: 'GPL-2.0-only'
      website: 'https://www.gnu.org/software/diffutils/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://https.git.savannah.gnu.org/git/diffutils.git'
      tag: 'v3.11'
      version: '3.11'
      sources_required:
        - gnulib
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
      regenerate:
        - args: ['python3', '@SOURCE_ROOT@/scripts/checkout-gnulib.py', '@SOURCE_ROOT@/ports/gnulib']
        - args: ['./bootstrap', '--skip-po']
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/build-aux/']
    tools_required:
      - system-gcc
      - host-autoconf-v2.69
      - host-automake-v1.15
    pkgs_required:
      - mlibc
    revision: 5
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-nls'
        - '--disable-werror'
      - args: 'sed -i s/-Werror//g @THIS_BUILD_DIR@/lib/Makefile'
      - args: 'sed -i s/-Werror//g @THIS_BUILD_DIR@/src/Makefile'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: dmidecode
    architecture: '@OPTION:arch@'
    metadata:
      summary: DMI (Desktop Management Interface) table related utilities
      description: Software tool that enables extraction of detailed hardware information from a system by decoding the DMI (Desktop Management Interface) table.
      spdx: 'GPL-2.0-only'
      website: 'https://www.nongnu.org/dmidecode/'
      maintainer: "no92 <no92.mail@gmail.com>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://https.git.savannah.gnu.org/git/dmidecode.git'
      tag: 'dmidecode-3-6'
      version: '3.6'
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 4
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
    build:
      - args: ['make', 'install-bin', '-j@PARALLELISM@']
        environ:
          CC: '@OPTION:arch-triple@-gcc'
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: drm-howto
    architecture: '@OPTION:arch@'
    metadata:
      summary: DRM modesetting examples
      description: DRM modesetting examples
      spdx: 'no-spdx: Public Domain'
      website: 'https://github.com/dvdhrm/docs'
      maintainer: "no92 <leo@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://github.com/dvdhrm/docs.git'
      branch: master
      commit: '815de035b291cfdf3c858d4420482ffa42c878a1'
      version: '20260708'
    tools_required:
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - libdrm
    revision: 1
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr'
        - '--buildtype=debugoptimized'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: drm_info
    architecture: '@OPTION:arch@'
    metadata:
      summary: Small utility to dump info about DRM devices.
      description: Small utility to dump info about DRM devices.
      spdx: 'MIT'
      website: 'https://gitlab.freedesktop.org/emersion/drm_info'
      maintainer: "no92 <no92.mail@gmail.com>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://gitlab.freedesktop.org/emersion/drm_info.git'
      tag: 'v2.5.0'
      version: '2.5.0'
    tools_required:
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - libdrm
      - json-c
    revision: 11
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nofallback'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: eza
    architecture: '@OPTION:arch@'
    stability_level: broken
    metadata:
      summary: A modern replacement for 'ls' written in Rust
      description: Eza is a modern `ls` replacement written in rust.
      spdx: 'Apache-2.0 MIT'
      website: 'https://eza.rocks'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://github.com/eza-community/eza.git'
      tag: 'v0.20.24'
      version: '0.20.24'
    tools_required:
      - host-cargo
      - system-gcc
    sources_required:
      - rust-patched-libs
    pkgs_required:
      - mlibc
    revision: 11
    configure:
      - args: ['@SOURCE_ROOT@/scripts/cargo-inject-patches.py', '@THIS_SOURCE_DIR@/Cargo.toml']
        isolate_network: false
    build:
      - args:
        - 'cargo'
        - 'install'
        - '--locked'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--path'
        - '@THIS_SOURCE_DIR@'
        - '--root'
        - '@THIS_COLLECT_DIR@/usr'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
        isolate_network: false
        environ: # Required to build libgit2
          CC: "@OPTION:arch-triple@-gcc"
      - args: ['rm', '-v', '@THIS_COLLECT_DIR@/usr/.crates.toml']
      - args: ['rm', '-v', '@THIS_COLLECT_DIR@/usr/.crates2.json']

  - name: file
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Identify a file's format by scanning binary data for patterns
      description: This package contains an utility for determining the type of a given file or files.
      spdx: 'BSD-2-Clause'
      website: 'https://www.darwinsys.com/file/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    from_source: file
    tools_required:
      - system-gcc
      - host-file
    pkgs_required:
      - mlibc
      - zlib
    revision: 4
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-bzlib'
        - '--disable-xzlib'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: findutils
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: GNU utilities for finding files
      description: This package contains programs to find files. Programs are provided to search through all the files in a directory tree and to create, maintain, and search a database.
      spdx: 'GPL-3.0-or-later'
      website: 'https://www.gnu.org/software/findutils/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://https.git.savannah.gnu.org/git/findutils.git'
      tag: 'v4.10.0'
      version: '4.10.0'
      sources_required:
        - gnulib
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
        - host-libtool
        - host-pkg-config
      regenerate:
        - args: ['python3', '@SOURCE_ROOT@/scripts/checkout-gnulib.py', '@SOURCE_ROOT@/ports/gnulib']
        - args: ['./bootstrap', '--skip-po']
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/build-aux/']
    tools_required:
      - system-gcc
      - host-python
    pkgs_required:
      - mlibc
    revision: 6
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--without-selinux'
        - '--disable-nls'
        - '--localstatedir=/var/lib/locate'
        environ:
          'PYTHON': '@BUILD_ROOT@/tools/host-python/bin/python3'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/keep-empty-directories.py', '@THIS_COLLECT_DIR@']

  - name: gawk
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: GNU awk pattern-matching language
      description: This package contains programs for manipulating text files.
      spdx: 'GPL-3.0-or-later'
      website: 'https://www.gnu.org/software/gawk/gawk.html'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://https.git.savannah.gnu.org/git/gawk.git'
      tag: 'gawk-5.3.1'
      version: '5.3.1'
      tools_required:
        - host-autoconf-v2.71
        - host-automake-v1.16
        - host-pkg-config
        - host-libtool
      regenerate:
        - args: sed -i 's/extras//' @THIS_SOURCE_DIR@/Makefile.in
        - args: ['autoreconf', '-fvi']
    tools_required:
      - system-gcc
      - host-autoconf-v2.71
      - host-automake-v1.16
    pkgs_required:
      - mlibc
    revision: 5
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-nls'
        - '--disable-extensions'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: grep
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: GNU regular expression matcher
      description: This package contains programs for searching through the contents of files.
      spdx: 'GPL-3.0-or-later'
      website: 'https://www.gnu.org/software/grep/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://https.git.savannah.gnu.org/git/grep.git'
      tag: 'v3.11'
      version: '3.11'
      sources_required:
        - gnulib
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
      regenerate:
        - args: ['python3', '@SOURCE_ROOT@/scripts/checkout-gnulib.py', '@SOURCE_ROOT@/ports/gnulib']
        - args: ['./bootstrap', '--skip-po']
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/build-aux/']
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: '@OPTION:arch-triple@'
    pkgs_required:
      - mlibc
      - pcre2
    revision: 12
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-nls'
      - args: 'sed -i s/-Werror//g @THIS_BUILD_DIR@/lib/Makefile'
      - args: 'sed -i s/-Werror//g @THIS_BUILD_DIR@/src/Makefile'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: groff
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Text formatter used for man pages
      description: This package contains programs for processing and formatting text and images.
      spdx: 'GPL-2.0-only'
      website: 'https://www.gnu.org/software/groff/groff.html/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: ports
      git: 'https://https.git.savannah.gnu.org/git/groff.git'
      tag: '1.22.4'
      version: '1.22.4'
      sources_required:
        - gnulib
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
        - host-pkg-config
        - host-libtool
      regenerate:
        - args: ['python3', '@SOURCE_ROOT@/scripts/checkout-gnulib.py', '@SOURCE_ROOT@/ports/gnulib']
        - args: ['./bootstrap', '--skip-po']
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/build-aux/']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 17
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--with-doc=no'
        environ:
          PAGE: 'A4'
      - args: 'sed -i s/"_GL_MATH_CXX_REAL_FLOATING_DECL_1 (signbit)"//g @THIS_SOURCE_DIR@/lib/math.in.h'
