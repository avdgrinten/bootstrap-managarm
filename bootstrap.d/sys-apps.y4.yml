        - '-Dlibcryptsetup=disabled'
        - '-Dlibcurl=disabled'
        - '-Dlibfido2=disabled'
        - '-Dlibidn=disabled'
        - '-Dlibidn2=disabled'
        - '-Dlibiptc=disabled'
        - '-Dlocaled=false'
        - '-Dlogind=true'
        - '-Dlz4=disabled'
        - '-Dmachined=false'
        - '-Dmicrohttpd=disabled'
