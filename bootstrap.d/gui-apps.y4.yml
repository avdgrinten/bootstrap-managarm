packages:
  - name: havoc
    architecture: '@OPTION:arch@'
    metadata:
      summary: Minimal terminal emulator for wayland
      description: This package contains a minimalistic terminal emulator for wayland.
      spdx: 'MIT'
      website: 'https://github.com/ii8/havoc'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['gui-apps']
    source:
      subdir: 'ports'
      git: 'https://github.com/ii8/havoc.git'
      tag: '0.6.0'
      version: '0.6.0'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
      - wayland-scanner
    pkgs_required:
      - mlibc
      - libxkbcommon
      - wayland
      - wayland-protocols
    revision: 5
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
    build:
      - args: ['make']
        environ:
          PKG_CONFIG_SYSROOT_DIR: '@BUILD_ROOT@/system-root'
          PKG_CONFIG_LIBDIR: '@BUILD_ROOT@/system-root/usr/lib/pkgconfig:@BUILD_ROOT@/system-root/usr/share/pkgconfig'
          PREFIX: '/usr'
          CC: "@OPTION:arch-triple@-gcc"
          CXX: "@OPTION:arch-triple@-g++"
          CPP: "@OPTION:arch-triple@-cpp"
      - args: ['make', 'install']
        environ:
          PKG_CONFIG_SYSROOT_DIR: '@BUILD_ROOT@/system-root'
          PKG_CONFIG_LIBDIR: '@BUILD_ROOT@/system-root/usr/lib/pkgconfig:@BUILD_ROOT@/system-root/usr/share/pkgconfig'
          PREFIX: '/usr'
          DESTDIR: '@THIS_COLLECT_DIR@'
          CC: "@OPTION:arch-triple@-gcc"
          CXX: "@OPTION:arch-triple@-g++"
          CPP: "@OPTION:arch-triple@-cpp"
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/home/managarm/.config']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/root/.config']
      - args: ['cp', '@THIS_SOURCE_DIR@/havoc.cfg', '@THIS_COLLECT_DIR@/home/managarm/.config/havoc.cfg']
      - args: ['cp', '@THIS_SOURCE_DIR@/havoc.cfg', '@THIS_COLLECT_DIR@/root/.config/havoc.cfg']
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: havoc-dbg
        include: ['/usr/lib/debug/**']

  - name: swaybg
    architecture: '@OPTION:arch@'
    metadata:
      summary: swaybg is a wallpaper utility for Wayland compositors
      description: "swaybg is a wallpaper utility for Wayland compositors. It is compatible with any Wayland compositor which implements the following Wayland protocols: wlr-layer-shell, xdg-output"
      spdx: MIT
      website: 'https://github.com/swaywm/swaybg'
      maintainer: "no92 <no92.mail@gmail.com>"
      categories: ['gui-apps']
    source:
      subdir: 'ports'
      git: 'https://github.com/swaywm/swaybg'
      tag: 'v1.2.1'
      version: '1.2.1'
    tools_required:
      - system-gcc
      - wayland-scanner
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
      - virtual: pkgconfig-for-host
        program_name: host-pkg-config
    pkgs_required:
      - mlibc
      - cairo
      - gdk-pixbuf
      - wayland
      - wayland-protocols
    revision: 6
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--prefix=/usr'
        - '--buildtype=debugoptimized'
        - '-Dman-pages=disabled'
        - '-Dgdk-pixbuf=disabled'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: swaybg-dbg
        include: ['/usr/lib/debug/**']

  - name: waypipe
    architecture: '@OPTION:arch@'
    metadata:
      summary: Network proxy for Wayland clients
      description: Waypipe is a proxy for Wayland clients. It forwards Wayland messages and serializes changes to shared memory buffers over a single socket.
      spdx: 'GPL-3.0-or-later'
      website: 'https://gitlab.freedesktop.org/mstoeckl/waypipe'
      maintainer: "48cf <me@iretq.dev>"
      categories: ['gui-apps']
    source:
      subdir: 'ports'
      git: 'https://gitlab.freedesktop.org/mstoeckl/waypipe.git'
      tag: 'v0.11.3'
      version: '0.11.3'
    tools_required:
      - host-cargo
      - host-rust
      - system-gcc
    sources_required:
      - rust-patched-libs
    pkgs_required:
      - mlibc
    revision: 1
    configure:
      - args: ['@SOURCE_ROOT@/scripts/cargo-inject-patches.py', '@THIS_SOURCE_DIR@/Cargo.toml']
        isolate_network: false
    build:
      # Without compression (lz4, zstd) and GPU (DMABUF, video) support for now.
      - args:
        - 'cargo'
        - 'build'
        - '--locked'
        - '--release'
        - '--no-default-features'
        - '--bin'
        - 'waypipe'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--manifest-path'
        - '@THIS_SOURCE_DIR@/Cargo.toml'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
        isolate_network: false
      - args: ['install', '-Dm755', '@THIS_BUILD_DIR@/@OPTION:rust-arch@-unknown-managarm-mlibc/release/waypipe', '@THIS_COLLECT_DIR@/usr/bin/waypipe']
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: waypipe-dbg
        include: ['/usr/lib/debug/**']

  - name: wlgears
    architecture: '@OPTION:arch@'
    metadata:
      summary: A port of glxgears to wayland
      description: "This utility is a port of the glxgears demo of mesa-demos onto wayland with a meson build system."
      spdx: MIT
      website: 'https://github.com/no92/wlgears'
      maintainer: "no92 <no92.mail@gmail.com>"
      categories: ['gui-apps']
    source:
      subdir: ports
      git: 'https://github.com/no92/wlgears.git'
      tag: 'v0.1.0'
      version: '0.1.0'
    tools_required:
      - system-gcc
      - wayland-scanner
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
      - virtual: pkgconfig-for-host
        program_name: host-pkg-config
    pkgs_required:
      - mlibc
      - libepoxy
      - mesa
      - wayland
      - wayland-protocols
    revision: 12
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: wlgears-dbg
        include: ['/usr/lib/debug/**']

  - name: wofi
    architecture: '@OPTION:arch@'
    metadata:
      summary: Rofi port to Wayland
      description: "Wofi is a launcher/menu program for wlroots based wayland compositors such as sway."
      spdx: GPL-3.0
      website: "https://hg.sr.ht/~scoopta/wofi"
      maintainer: "kspatlas <kspatlas@disroot.org>"
      categories: ['gui-apps']
    source:
      subdir: ports
      hg: "https://hg.sr.ht/~scoopta/wofi"
      tag: 'v1.4.1'
      version: '1.4.1'
    tools_required:
      - system-gcc
      - wayland-scanner
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
      - virtual: pkgconfig-for-host
        program_name: host-pkg-config
    pkgs_required:
      - mlibc
      - gtk+-3
      - wayland
    revision: 7
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nofallback'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: wofi-dbg
        include: ['/usr/lib/debug/**']

