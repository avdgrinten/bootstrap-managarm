sources:
  - name: 'cmake'
    subdir: 'ports'
    git: 'https://gitlab.kitware.com/cmake/cmake.git'
    tag: 'v4.0.0'
    version: '4.0.0'

  - name: ninja
    subdir: ports
    git: 'https://github.com/ninja-build/ninja.git'
    tag: 'v1.13.2'
    version: '1.13.2'

  - name: 'pkg-config'
    subdir: 'ports'
    git: 'https://gitlab.freedesktop.org/pkg-config/pkg-config.git'
    tag: 'pkg-config-0.29.2'
    version: '0.29.2'
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.11
      - host-libtool
    regenerate:
      - args: ['./autogen.sh']
        environ:
          'NOCONFIGURE': 'yes'

  - name: 'pkgconf'
    subdir: 'ports'
    git: 'https://github.com/pkgconf/pkgconf.git'
    tag: 'pkgconf-2.5.1'
    version: '2.5.1'
    tools_required:
      - host-autoconf-v2.71
      - host-automake-v1.16
      - host-libtool
    regenerate:
      - args: ['./autogen.sh']
        environ:
          'NOCONFIGURE': 'yes'

tools:
  - name: host-cmake
    labels: [aarch64, riscv64]
    architecture: noarch
    from_source: cmake
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/bootstrap'
        - '--prefix=@PREFIX@'
        - '--parallel=@PARALLELISM@'
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'install']
      - args: ['ln', '-sf', '@SOURCE_ROOT@/scripts/managarm.cmake', '@PREFIX@/share/cmake-4.0/Modules/Platform/']

  - name: host-cargo-cbuild
    architecture: noarch
    labels: [aarch64, riscv64]
    source:
      subdir: 'ports'
      git: 'https://github.com/lu-zero/cargo-c.git'
      tag: 'v0.10.16'
      version: '0.10.16'
    tools_required:
      - tool: host-rust
        recursive: true
      - tool: system-gcc # GCC is used for linking
        recursive: true
      - host-cargo
    sources_required:
      # This cargo runs on the host, so we don't actually need any patches here. We just
      # add the sources used by cargo so that the dependency resolver doesn't complain.
      - rust-patched-libs
    revision: 4
    compile:
      - args:
        - 'cargo'
        - 'install'
        - '--target'
        - 'x86_64-unknown-linux-gnu'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--path'
        - '@THIS_SOURCE_DIR@'
        - '-j@PARALLELISM@'
        - '--root'
        - '@PREFIX@'
        isolate_network: false

  - name: host-lxqt-build-tools
    architecture: noarch
    source:
      subdir: ports
      git: 'https://github.com/lxqt/lxqt-build-tools.git'
      tag: '2.2.0'
      version: '2.2.0'
    tools_required:
      - host-qt6
      - host-cmake
    revision: 1
    configure:
      - args:
        - 'cmake'
        - '-DCMAKE_INSTALL_PREFIX=@PREFIX@'
        - '@THIS_SOURCE_DIR@'
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'install']

  - name: host-ninja
    architecture: noarch
    from_source: ninja
    tools_required:
      - host-cmake
    revision: 1
    configure:
      - args:
        - 'cmake'
        - '-DCMAKE_INSTALL_PREFIX=@PREFIX@'
        - '-DBUILD_TESTING=OFF'
        - '@THIS_SOURCE_DIR@'
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'install']

  # We could run an external pkg-config; however, we need the aclocal files.
  # The easiest way to ensure that they are available is to just install pkg-config.
  - name: host-pkg-config
    labels: [aarch64, riscv64]
    architecture: noarch
    exports_aclocal: true
    from_source: pkg-config
    revision: 2
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--prefix=@PREFIX@'
        - '--with-internal-glib'
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'install']

  # We could run an external pkg-config; however, we need the aclocal files.
  # The easiest way to ensure that they are available is to just install pkg-config.
  - name: host-pkgconf
    labels: [aarch64, riscv64]
    architecture: noarch
    exports_aclocal: true
    from_source: pkgconf
    revision: 1
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--prefix=@PREFIX@'
        - '--with-system-includedir=@SYSROOT_DIR@/usr/include'
        - '--with-system-libdir=@SYSROOT_DIR@/usr/lib'
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'install']
      - args: ['ln', '-svf', pkgconf, '@PREFIX@/bin/pkg-config']

  - name: host-tzdb
    stability_level: 'broken' # XXX xbstrap does not handle tar.lz?
    architecture: '@OPTION:arch@'
    source:
      subdir: 'ports'
      url: 'https://data.iana.org/time-zones/releases/tzdb-2024a.tar.lz'
      format: 'tar.xz'
      checksum: blake2b:91d6c55c4f860ced760df84a1751174f1eb8ea83939b44d3a206dccbc9bac1713fbcde70391deaa4ed01d95e6de08bc0b751d296bebdf5d9ca0b4534942694cf
      extract_path: 'tzdb-2024a'
      version: '2024a'
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
      - args: ['sed', '-i', 's/sbin/bin/g', '@THIS_BUILD_DIR@/Makefile']
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['make', 'TOPDIR=@PREFIX@', 'install']

  - name: wayland-scanner
    labels: [aarch64, riscv64]
    architecture: noarch
    from_source: wayland
    tools_required:
      - virtual: pkgconfig-for-host
        program_name: host-pkg-config
    revision: 1
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--prefix=@PREFIX@'
        - '-Ddtd_validation=false'
        - '-Ddocumentation=false'
        - '-Dscanner=true'
        - '-Dlibraries=false'
        - '-Dtests=false'
        - '@THIS_SOURCE_DIR@'
    compile:
      - args: ['ninja']
    install:
      - args: ['ninja', 'install']

packages:
  - name: cmake
    architecture: '@OPTION:arch@'
    metadata:
      summary: Cross platform Make
      description: This package contains a modern toolset used for generating Makefiles. It is a successor of the auto-generated configure script and aims to be platform- and compiler-independent. A significant user of CMake is KDE since version 4.
      spdx: 'BSD'
      website: 'https://cmake.org/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['dev-util']
    from_source: cmake
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - curl
      - libarchive
      - libexpat
      - libuv
      - libxml
      - openssl
      - xz-utils
      - zlib
      - zstd
    revision: 6
    configure:
      - args: ['sed', '-i', '/"lib64"/s/64//', '@THIS_SOURCE_DIR@/Modules/GNUInstallDirs.cmake']
      - args: ['cp', '-f', '@SOURCE_ROOT@/scripts/managarm.cmake', '@THIS_SOURCE_DIR@/Modules/Platform/']
      - args:
        - '@THIS_SOURCE_DIR@/bootstrap'
        - '--prefix=/usr'
        - '--system-libs'
        - '--mandir=/usr/share/man'
        - '--datadir=/usr/share/cmake-4.0'
        - '--no-system-jsoncpp'
        - '--no-system-librhash'
        - '--no-system-cppdap'
        - '--docdir=/usr/share/doc/cmake-4.0.0'
        - '--parallel=@PARALLELISM@'
        - '--'
        - '-DCMAKE_TOOLCHAIN_FILE=@SOURCE_ROOT@/scripts/CMakeToolchain-@OPTION:arch-triple@.txt'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: cmake-dbg
        include: ['/usr/lib/debug/**']

  - name: desktop-file-utils
    architecture: '@OPTION:arch@'
    metadata:
      summary: Command line utilities to work with desktop menu entries
      description: This package contains command line utilities for working with Desktop entries. These utilities are used by Desktop Environments and other applications to manipulate the MIME-types application databases and help adhere to the Desktop Entry Specification.
      spdx: 'GPL-2.0-or-later'
      website: 'https://freedesktop.org/wiki/Software/desktop-file-utils/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['dev-util']
    source:
      subdir: ports
      git: 'https://gitlab.freedesktop.org/xdg/desktop-file-utils.git'
      tag: '0.26'
      version: '0.26'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.11
        - host-libtool
        - host-pkg-config
      regenerate:
        - args: ['./autogen.sh']
          environ:
            'NOCONFIGURE': 'yes'
    tools_required:
      - system-gcc
      - host-libtool
      - host-pkg-config
    pkgs_required:
      - mlibc
      - glib
    revision: 10
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: desktop-file-utils-dbg
        include: ['/usr/lib/debug/**']

  - name: git-delta
    stability_level: 'broken' # Rustix new version got imported, ignore for now.
    architecture: '@OPTION:arch@'
    metadata:
      summary: A syntax-highlighting pager for git
      description: Delta is a syntax-highlighting pager for git.
      spdx: 'Apache-2.0 BSD LGPL-3.0-or-later MIT'
      website: 'https://github.com/dandavison/delta'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['dev-util']
    source:
      subdir: ports
      git: 'https://github.com/dandavison/delta.git'
      tag: '0.18.2'
      version: '0.18.2'
    tools_required:
      - host-cargo
      - system-gcc
    sources_required:
      - rust-patched-libs
    pkgs_required:
      - mlibc
    revision: 11
    configure:
      - args: ['@SOURCE_ROOT@/scripts/cargo-inject-patches.py', '@THIS_SOURCE_DIR@/Cargo.toml']
        isolate_network: false
    build:
      - args:
        - 'cargo'
        - 'install'
        - '--locked'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--path'
        - '@THIS_SOURCE_DIR@'
        - '--root'
        - '@THIS_COLLECT_DIR@/usr'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
        environ:
          CC: "@OPTION:arch-triple@-gcc"
        isolate_network: false
      - args: ['rm', '-v', '@THIS_COLLECT_DIR@/usr/.crates.toml']
      - args: ['rm', '-v', '@THIS_COLLECT_DIR@/usr/.crates2.json']

  - name: gnome-desktop-testing
    architecture: '@OPTION:arch@'
    metadata:
      summary: GNOME test runner
      description: gnome-desktop-testing is a basic runner for installed tests.
      spdx: 'GPL-2.0-only'
      website: 'https://gitlab.gnome.org/GNOME/gnome-desktop-testing'
      maintainer: "no92 <leo@managarm.org>"
      categories: ['dev-utils']
    source:
      subdir: 'ports'
      git: 'https://gitlab.gnome.org/GNOME/gnome-desktop-testing.git'
      branch: 'master'
      commit: 036b7357f1892b3bdf19aba8d0be7d7b75bda291
      version: '2024.01.10'
    tools_required:
      - host-pkg-config
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - glib
      - systemd
    revision: 4
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: gnome-desktop-testing-dbg
        include: ['/usr/lib/debug/**']

  - name: itstool
    architecture: '@OPTION:arch@'
    metadata:
      summary: Translation tool for XML documents that uses gettext files and ITS rules
      description: This package contains a program for translating XML with PO files using W3C Internationalization Tag Set rules.
      spdx: 'GPL-3.0-or-later'
      website: 'https://itstool.org/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['dev-util']
    source:
      subdir: ports
      git: 'https://github.com/itstool/itstool.git'
      tag: '2.0.7'
      version: '2.0.7'
      tools_required:
          - host-autoconf-v2.69
          - host-automake-v1.11
          - host-libtool
          - host-pkg-config
      regenerate:
        - args: ['./autogen.sh']
          environ:
            'NOCONFIGURE': 'yes'
    tools_required:
      - system-gcc
      - host-python
    pkgs_required:
      - mlibc
      - libxml
      - python
    revision: 14
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        environ:
          'PYTHON': '/usr/bin/python3'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      # No split debug needed, it's just a script

  - name: ninja
    architecture: '@OPTION:arch@'
    metadata:
      summary: The Ninja build system
      description: Ninja is a small build system similar to make.
      spdx: 'Apache-2.0'
      website: 'https://ninja-build.org/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['dev-util']
    from_source: ninja
    tools_required:
      - system-gcc
      - host-cmake
    pkgs_required:
      - mlibc
    revision: 3
    configure:
      - args:
        - 'cmake'
        - '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
        - '-DCMAKE_TOOLCHAIN_FILE=@SOURCE_ROOT@/scripts/CMakeToolchain-@OPTION:arch-triple@.txt'
        - '-DCMAKE_INSTALL_PREFIX=/usr'
        - '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
        - '-DBUILD_TESTING=false'
        - '-Wno-dev'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: ninja-dbg
        include: ['/usr/lib/debug/**']

  - name: pkg-config
    architecture: '@OPTION:arch@'
    from_source: pkg-config
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - glib
    revision: 14
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-static'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: pkg-config-dbg
        include: ['/usr/lib/debug/**']

  - name: vulkan-headers
    architecture: '@OPTION:arch@'
    metadata:
      summary: Vulkan Header files and API registry
      description: This package provides the Vulkan header files. This is needed to compile Vulkan applications.
      spdx: 'MIT'
      website: 'https://github.com/KhronosGroup/Vulkan-Headers'
      maintainer: "Alexander Richards <electrodeyt@gmail.com>"
      categories: ['dev-util']
    source:
      subdir: 'ports'
      git: 'https://github.com/KhronosGroup/Vulkan-Headers.git'
      tag: 'v1.3.269'
      version: '1.3.269'
    tools_required:
      - system-gcc
      - host-cmake
    pkgs_required:
      # This is only a build-time dependency.
      - mlibc
    revision: 9
    configure:
      - args:
        - 'cmake'
        - '-GNinja'
        - '-DCMAKE_TOOLCHAIN_FILE=@SOURCE_ROOT@/scripts/CMakeToolchain-@OPTION:arch-triple@.txt'
        - '-DCMAKE_PREFIX=/usr'
        - '-DCMAKE_INSTALL_PREFIX=/usr'
        - '-DBUILD_TESTS=OFF'
        - '@THIS_SOURCE_DIR@/'
    build:
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: pc
    architecture: '@OPTION:arch@'
    metadata:
      summary: Portable programmer's calculator
      description: Portable programmer's calculator for C language math and logic expressions
      spdx: 'MIT'
      website: 'https://github.com/johnsonjh/pc'
      maintainer: "Jeffrey H. Johnson <trnsz@pobox.com>"
      categories: ['dev-util']
    source:
      subdir: 'ports'
      git: 'https://github.com/johnsonjh/pc.git'
      branch: 'master'
      commit: 'cc93a281237e995bca29c0c2c2c4ae86e3e1d548'
      version: '2025.10.19'
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 4
    build:
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/bin']
      - args: ['@OPTION:arch-triple@-gcc', '-Os', '-s', '@THIS_SOURCE_DIR@/pc.c', '-o', '@THIS_COLLECT_DIR@/usr/bin/pc']
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: pc-dbg
        include: ['/usr/lib/debug/**']

  - name: os-test
    architecture: '@OPTION:arch@'
    metadata:
      summary: POSIX operating system test suite
      description: A set of test suites for POSIX operating systems designed to make it easy to compare differences and to find bugs
      spdx: 'ISC'
      website: 'https://sortix.org/os-test/'
      maintainer: "no92 <leo@managarm.org>"
      categories: ['dev-util']
    source:
      subdir: 'ports'
      git: 'https://gitlab.com/sortix/os-test.git'
      branch: 'main'
      commit: '89da5d6e7c30143599794232972f701a9d95380e'
      rolling_version: true
      version: '0.0pl@ROLLING_ID@'
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - make
      - libiconv
      - libintl
    revision: 3
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
      - args: ['rm', '-rf', '@THIS_BUILD_DIR@/out/']
    build:
      - args: |
          make clean
      - args:
        - 'make'
        - '-j@PARALLELISM@'
        - 'OS=Managarm'
        - 'CC=@OPTION:arch-triple@-gcc'
        - 'CC_FOR_BUILD=gcc'
        - 'LDFLAGS_FOR_BUILD='
        - 'all'
      - args: |
          mkdir -p @THIS_COLLECT_DIR@/opt/os-test/
          cp -r ./ @THIS_COLLECT_DIR@/opt/os-test/
          echo inconsistent hangs > @THIS_COLLECT_DIR@/opt/os-test/out/managarm/basic/signal/killpg.out
          rm @THIS_COLLECT_DIR@/opt/os-test/*.xbstrap
