!<tag:y4.managarm.org:preamble>
import:
  - !managarm
---
tasks:
  - name: useful-image-dependencies
    pkgs_required:
      - base
      - weston-desktop
    tools_required:
      - system-gcc
    args: ''

  - name: update-initrd
    pkgs_required:
      - libgcc
      - libstdc++
      - managarm-kernel
      - managarm-system
      - managarm-system-rs
    tasks_required:
      - task: useful-image-dependencies
        order_only: true
      - task: initialize-empty-image
        order_only: true
    tools_required:
      - cross-binutils
    args:
      - '@SYSROOT_DIR@/usr/managarm/bin/gen-initrd.py'
      - '--triple'
      - '@OPTION:arch-triple@'
      - '--sysroot=@SYSROOT_DIR@'
    workdir: '@BUILD_ROOT@'

  # Adds the base directories, the live image's users and the stable xbps repository to the sysroot.
  # Rerunning it is harmless, and it must rerun after every install of core-files.
  - name: provision-sysroot
    pkgs_required:
      - core-files
      - managarm-scripts
    args:
      - '@SYSROOT_DIR@/usr/managarm/bin/provision-sysroot.py'
      - 'apply'
      - '--root'
      - '@SYSROOT_DIR@'
      - '--base-dirs'
      - '--arch'
      - '@OPTION:arch@'
      - '--xbps-stable'
      - '--user'
      - 'managarm'
      - '--groups'
      - 'managarm'
      - 'wheel,users'
      - '--password-hash'
      - 'managarm'
      - 'WJg36EZUlJ96k'
      - '--password-hash'
      - 'root'
      - '4T1CNB2BgzJeI'
      - '--sshd-password-auth'
      - '--sysusers'
    workdir: '@BUILD_ROOT@'

  - name: initialize-empty-image
    sources_required:
      - image_create
    tools_required:
      - host-limine
    args: |
      if [ "@OPTION:arch@" == x86_64 ]; then
          biosboot=-b # Install the BIOS bootloader only on x86_64.
      fi
      @SOURCE_ROOT@/ports/image_create/image_create.sh \
      -oimage \
      -s@OPTION:image-size@ \
      -pgpt \
      -text2 \
      -llimine \
      -a@OPTION:arch@ \
      -e \
      $biosboot
    environ:
      'LIMINE_BIN_DIR': '@BUILD_ROOT@/tools/host-limine/share/limine'
      'LIMINE_TOOL': '@BUILD_ROOT@/tools/host-limine/share/limine/limine'
      'GPT_TYPE': '64212B3B-56A1-4DFB-971E-BC8CD027996A'
    workdir: '@BUILD_ROOT@'

  - name: make-image
    pkgs_required:
      - core-files
      - limine
      - managarm-kernel
      - managarm-kernel-uefi
      - managarm-scripts
      - managarm-system
    tools_required:
      - tool: host-limine
        expose: false
    tasks_required:
      - update-initrd
      - provision-sysroot
    args:
      - '@SOURCE_ROOT@/scripts/update-image.py'
      - '--triple'
      - '@OPTION:arch-triple@'
      - '--mount-using'
      - '@OPTION:mount-using@'
    workdir: '@BUILD_ROOT@'
    containerless: true

  # Like make-image but do not use root regardless of mount-using.
  - name: make-image-rootless
    pkgs_required:
      - core-files
      - limine
      - managarm-kernel
      - managarm-kernel-uefi
      - managarm-scripts
      - managarm-system
    tools_required:
      - tool: host-limine
        expose: false
    tasks_required:
      - update-initrd
      - provision-sysroot
    args:
      - '@SOURCE_ROOT@/scripts/update-image.py'
      - '--triple'
      - '@OPTION:arch-triple@'
      - '--mount-using'
      - 'guestfs'
    workdir: '@BUILD_ROOT@'
    containerless: true

  - name: remake-image
    pkgs_required:
      - core-files
      - limine
      - managarm-kernel
      - managarm-kernel-uefi
      - managarm-scripts
      - managarm-system
    tools_required:
      - tool: host-limine
        expose: false
    tasks_required:
      - update-initrd
      - provision-sysroot
    args:
      - '@SOURCE_ROOT@/scripts/update-image.py'
      - '--triple'
      - '@OPTION:arch-triple@'
      - '--with-sysroot'
      - '@SYSROOT_DIR@'
      - 'remake'
    workdir: '@BUILD_ROOT@'

  - name: xz-image
    tasks_required:
      - task: make-image
        order_only: true
      - task: remake-image
        order_only: true
    artifact_files:
      - name: image.xz
        architecture: '@OPTION:arch@'
        path: '@BUILD_ROOT@'
    args: ['xz', '--fast', '--keep', '@BUILD_ROOT@/image']

  - name: get-nightly-image
    args: |
      wget https://repos.managarm.org/images/image-nightly-@OPTION:arch@.zst -O image.zst
      zstd -d --rm image.zst
    workdir: '@BUILD_ROOT@'
    containerless: true

  - name: get-stable-image
    args: |
      wget https://repos.managarm.org/images/image-stable-@OPTION:arch@.zst -O image.zst
      zstd -d --rm image.zst
    workdir: '@BUILD_ROOT@'
    containerless: true

  - name: make-uki
    tools_required:
      - tool: host-llvm-toolchain
    tasks_required:
      - update-initrd
    args: |
        set -e
        f=$(mktemp)
        echo -n 'sif' > "$f"
        rm -f eir-uefi.efi
        llvm-objcopy \
            --add-section .initrd=initrd.cpio \
            --set-section-flags .initrd=data,readonly \
            --add-section .cmdline="$f" \
            --set-section-flags .cmdline=data,readonly \
            system-root/usr/managarm/bin/eir-uefi eir-uefi.efi
        rm "$f"
    workdir: '@BUILD_ROOT@'

  - name: qemu
    tools_required:
      - tool: ovmf
        expose: false
    tasks_required:
      - task: make-image
        order_only: true
      - task: remake-image
        order_only: true
    args:
      - '@SOURCE_ROOT@/scripts/vm-util.py'
      - 'qemu'
      - '--arch'
      - '@OPTION:arch@'
    workdir: '@BUILD_ROOT@'
    containerless: true

  - name: test-image
    tools_required:
      - tool: ovmf
        expose: false
    tasks_required:
      - task: make-image
        order_only: true
      - task: remake-image
        order_only: true
    args:
      - '@SOURCE_ROOT@/scripts/vm-util.py'
      - 'qemu'
      - '--arch'
      - '@OPTION:arch@'
      - '--timeout=1200'
      - '--io-timeout=300'
      - '--expect'
      - "Message received from greeter: Connect"
    environ:
      QFLAGS: '-snapshot -display none'
    workdir: '@BUILD_ROOT@'
    containerless: true

  - name: test-image-acpi
    tools_required:
      - tool: ovmf
        expose: false
    tasks_required:
      - task: make-image
        order_only: true
      - task: remake-image
        order_only: true
    args:
      - '@SOURCE_ROOT@/scripts/vm-util.py'
      - 'qemu'
      - '--arch'
      - '@OPTION:arch@'
      - '--timeout=1200'
      - '--io-timeout=300'
      - '--acpi'
      - '--expect'
      - "Message received from greeter: Connect"
    environ:
      QFLAGS: '-snapshot -display none'
    workdir: '@BUILD_ROOT@'
    containerless: true

  - name: mlibc-docs
    pkgs_required:
      - mlibc-docs
    args:
      - 'python'
      - '-m'
      - 'http.server'
      - '8080'
      - '-d'
      - '@BUILD_ROOT@/pkg-builds/mlibc-docs/docs'
    containerless: true

  - name: mlibc-sysdeps
    args:
      - '@SOURCE_ROOT@/scripts/compile-mlibc-sysdeps.sh'
      - '@SOURCE_ROOT@/mlibc'
      - '@SYSROOT_DIR@/usr/src/linux-headers'
    workdir: '@BUILD_ROOT@'

  - name: generate-pcap
    tools_required:
      - tool: host-managarm-tools
    args:
      - '@BUILD_ROOT@/tools/host-managarm-tools/bin/extract-ostrace'
      - 'ostrace.bin'
      - '--pcap'
    workdir: '@BUILD_ROOT@'
