  - name: openssh
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Port of OpenBSD's free SSH release
      description: 'OpenSSH is the premier connectivity tool for remote login with the SSH protocol. It encrypts all traffic to eliminate eavesdropping, connection hijacking, and other attacks. In addition, OpenSSH provides a large suite of secure tunneling capabilities, several authentication methods, and sophisticated configuration options.'
      spdx: 'SSH-OpenSSH'
      website: 'https://www.openssh.org/'
      maintainer: 'no92 <leo@managarm.org>'
      categories: ['net-misc']
    source:
      subdir: 'ports'
      git: 'https://github.com/openssh/openssh-portable.git'
      tag: 'V_10_0_P2'
      version: '10.0p2'
      tools_required:
        - host-automake-v1.15
      regenerate:
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/']
        - args: ['autoreconf', '-fvi']
    tools_required:
      - host-pkg-config
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - openssl
      - pam
      - zlib
    revision: 8
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc/ssh'
        - '--with-privsep-path=/var/lib/sshd'
        - '--with-default-path=/usr/bin'
        - '--with-superuser-path=/usr/sbin:/usr/bin'
        - '--with-pid-dir=/run'
        - '--with-pam'
        - '--with-systemd'
        - '--disable-strip'
        environ:
          CONFIG_SITE: '@SOURCE_ROOT@/scripts/config.site'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/lib/systemd/system']
      - args: |
          cat << EOF > @THIS_COLLECT_DIR@/usr/lib/systemd/system/sshd.service
          [Unit]
          Description=OpenSSH server daemon
          After=network.target

          [Service]
          ExecStartPre=/usr/bin/ssh-keygen -A
          ExecStart=/usr/sbin/sshd -D -e
          ExecReload=/bin/kill -HUP $MAINPID
          KillMode=process
          OOMPolicy=continue
          Restart=on-failure
          RestartSec=42s

          [Install]
          WantedBy=multi-user.target
          EOF
      # sshd uses the first value it reads, so the drop-ins go first to override the settings below.
      - args: ['sed', '-i', '1i Include /etc/ssh/sshd_config.d/*.conf\n', '@THIS_COLLECT_DIR@/etc/ssh/sshd_config']
      - args: |
          echo "UsePAM yes" >> @THIS_COLLECT_DIR@/etc/ssh/sshd_config
          echo "PermitRootLogin no" >> @THIS_COLLECT_DIR@/etc/ssh/sshd_config
          echo "PasswordAuthentication no" >> @THIS_COLLECT_DIR@/etc/ssh/sshd_config
          echo "KbdInteractiveAuthentication no" >> @THIS_COLLECT_DIR@/etc/ssh/sshd_config
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/multi-user.target.wants']
      - args: ['ln', '-svn', '../sshd.service', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/multi-user.target.wants/']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/etc/tmpfiles.d']
      - args: |
          cat << EOF > @THIS_COLLECT_DIR@/etc/tmpfiles.d/sshd.conf
          #Type  Path           Mode  UID   GID   Age  Argument
          d      /var/lib/sshd  0755  root  root  -    -
          EOF
      - args: ['install', '-v', '-m755', '@THIS_SOURCE_DIR@/contrib/ssh-copy-id', '@THIS_COLLECT_DIR@/usr/bin']
      - args: ['install', '-v', '-m644', '@THIS_SOURCE_DIR@/contrib/ssh-copy-id.1', '@THIS_COLLECT_DIR@/usr/share/man/man1']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/etc/pam.d/']
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/pam.d/sshd', '@THIS_COLLECT_DIR@/etc/pam.d/']
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: openssh-dbg
        include: ['/usr/lib/debug/**']
    scripts:
      post_install:
        - args: ['systemd-sysusers']
