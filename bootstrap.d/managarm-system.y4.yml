!<tag:y4.managarm.org:preamble>
import:
  - !managarm
---
sources:
  - name: cli11
    subdir: 'ports'
    git: 'https://github.com/CLIUtils/CLI11.git'
    tag: 'v2.6.1'
    version: '2.6.1'

  - name: uacpi
    subdir: 'ports'
    git: 'https://github.com/uACPI/uACPI.git'
    branch: 'master'
    commit: 686a9a52d9ad72690406d7cada82801377d5e2fa
    rolling_version: true
    version: '0.0pl@ROLLING_ID@'

  - name: uhda
    subdir: 'ports'
    git: 'https://github.com/uDrivers/uHDA.git'
    branch: 'main'
    rolling_version: true
    commit: 4e10f054d49cf142a4aad9679c136ac6fe5f5815
    version: '0.0pl@ROLLING_ID@'

  - name: managarm
    git: 'https://github.com/managarm/managarm.git'
    branch: 'master'
    rolling_version: true
    version: '0.0pl@ROLLING_ID@'
    sources_required:
      - cralgo
    regenerate:
      - args: ['mkdir', '-p', '@THIS_SOURCE_DIR@/subprojects']
      - args: ['ln', '-sf', '@SOURCE_ROOT@/ports/cralgo', '@THIS_SOURCE_DIR@/subprojects/']


tools:
  - name: host-managarm-tools
    labels: [aarch64, riscv64]
    architecture: noarch
    from_source: managarm
    tools_required:
      - host-frigg
      - host-bragi
      - host-bragi-headers
      - host-cli11
      - virtual: pkgconfig-for-host
        program_name: host-pkg-config
    revision: 1
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--prefix=@PREFIX@'
        - '-Dbuild_tools=true'
        - '-Dbuild_testsuite=true'
        - '@THIS_SOURCE_DIR@'
        isolate_network: false
    compile:
      - args: ['ninja']
    install:
      - args: ['ninja', 'install']


packages:
  - name: boot-artifacts
    metadata:
      summary: Boot artifact generation scripts
      description: Generates artifacts needed to boot various boards and SoCs
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "Alexander van der Grinten <avdgrinten@managarm.org>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: noarch
    default: true
    source:
      rolling_version: true
      version: '0.0pl@ROLLING_ID@'
      subdir: 'ports'
      git: 'https://github.com/managarm/boot-artifacts.git'
      branch: 'main'
    revision: 1
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--prefix=/usr/managarm'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nofallback'
        - '@THIS_SOURCE_DIR@'
        isolate_network: false
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: managarm-kernel
    metadata:
      summary: The Managarm kernel
      description: This package provides the Managarm kernel.
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "Alexander van der Grinten <avdgrinten@managarm.org>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    default: true
    from_source: managarm
    tools_required:
      - host-llvm-toolchain
      - host-managarm-tools
      - host-bragi
      - kernel-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - bragi
      - frigg
      - libasync
      - libarch
      - libsmarter
      - uacpi
      - mlibc-headers
    revision: 3
    configure:
      - args: |
          sed -e 's|_BUILD_ROOT_|@BUILD_ROOT@|' @SOURCE_ROOT@/scripts/meson-kernel-@OPTION:arch-triple@.cross-file \
              > ./meson-custom.cross-file
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file=@SOURCE_ROOT@/scripts/meson-kernel-common.cross-file'
        - '--cross-file=./meson-custom.cross-file'
        - '--prefix=/usr/managarm'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nofallback'
        - '-Dbuild_kernel=true'
        - '-Db_lto=true'
        - '@THIS_SOURCE_DIR@'
        isolate_network: false
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '@THIS_COLLECT_DIR@']
    tasks:
    - name: clang-tidy
      args:
      - 'run-clang-tidy'
      - '-config-file'
      - '@SOURCE_ROOT@/managarm/.clang-tidy'
      # suppress clang's "x warnings generated" spam
      - '-extra-arg=-fno-caret-diagnostics'
      - '-source-filter=^(?!@SOURCE_ROOT@/managarm/subprojects/)(?!@BUILD_ROOT@/system-root/usr/share/uacpi/)'
      - '-warnings-as-errors=*'
      - '-quiet'
      - '\.(h|c|cpp|hpp)$'
    - name: clang-tidy-autofix
      args:
      - 'run-clang-tidy'
      - '-config-file'
      - '@SOURCE_ROOT@/managarm/.clang-tidy'
      # suppress clang's "x warnings generated" spam
      - '-extra-arg=-fno-caret-diagnostics'
      - '-source-filter=^(?!@SOURCE_ROOT@/managarm/subprojects/)(?!@BUILD_ROOT@/system-root/usr/share/uacpi/)'
      - '-quiet'
      - '-fix'
      - '\.(h|c|cpp|hpp)$'
    - name: clang-format
      args:
      - 'ninja'
      - 'clang-format'
    - name: clang-format-check
      args:
      - 'ninja'
      - 'clang-format-check'
    scripts:
      post_install:
        - args: ['/usr/managarm/bin/update-boot.py', 'update-esp']

  - name: managarm-kernel-uefi
    metadata:
      summary: eir for UEFI
      description: This package provides eir-uefi.
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "Marvin Friedrich <contact@marvinf.com>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    default: true
    from_source: managarm
    tools_required:
      - host-llvm-toolchain
      - host-managarm-tools
      - host-bragi
      - host-pkg-config
      - !managarm::arch_dep
        arch: [riscv64]
        item: ovmf
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - bragi
      - frigg
      - libasync
      - libarch
      - libsmarter
      - mlibc-headers
      - freestnd-c-hdrs
      - freestnd-cxx-hdrs
      - uacpi
    revision: 3
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file=@SOURCE_ROOT@/scripts/meson-kernel-common.cross-file'
        - '--cross-file=@SOURCE_ROOT@/scripts/meson-kernel-uefi-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr/managarm'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nofallback'
        - '-Dbuild_kernel=true'
        - '-Dbuild_uefi=true'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
    tasks:
    - name: clang-tidy
      args:
      - 'run-clang-tidy'
      - '-config-file'
      - '@SOURCE_ROOT@/managarm/.clang-tidy'
      # suppress clang's "x warnings generated" spam
      - '-extra-arg=-fno-caret-diagnostics'
      - '-source-filter=^(?!@SOURCE_ROOT@/managarm/subprojects/)(?!@BUILD_ROOT@/system-root/usr/share/uacpi/)'
      - '-warnings-as-errors=*'
      - '-quiet'
      - '\.(h|c|cpp|hpp)$'
    scripts:
      post_install:
        - args: ['/usr/managarm/bin/update-boot.py', 'update-esp']

  - name: uhda
    metadata:
      summary: The uHDA HDA driver
      description: This package provides a HDA driver.
      spdx: 'BSD-3-Clause'
      website: 'https://github.com/uDrivers/uHDA'
      maintainer: "Qwinci <qwinci222@gmail.com>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    from_source: uhda
    tools_required:
      - host-llvm-toolchain
      - host-mold
      - cross-binutils
    pkgs_required:
      - mlibc
    revision: 2
    configure:
      - args: |
          sed -e 's|_BUILD_ROOT_|@BUILD_ROOT@|' -e 's|_SYSROOT_DIR_|@SYSROOT_DIR@|' @SOURCE_ROOT@/scripts/meson-clang-@OPTION:arch-triple@.cross-file \
              > ./meson-custom.cross-file
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file=./meson-custom.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nodownload'
        - '-Dbuild_library=true'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: uhda-dbg
        include: ['/usr/lib/debug/**']

  - name: managarm-system
    metadata:
      summary: The Managarm userspace
      description: This package provides the Managarm userspace components, various drivers and the POSIX emulation layer.
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "Alexander van der Grinten <avdgrinten@managarm.org>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    default: true
    from_source: managarm
    tools_required:
      - host-llvm-toolchain
      - host-managarm-tools
      - host-bragi
      - host-pkg-config
      - host-mold
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - systemd
      - fafnir
      - frigg
      - lewis
      - libasync
      - libarch
      - libdrm
      - libsmarter
      - cli11
      - boost
      - bragi
      - uhda
      - !managarm::arch_dep
        arch: [x86_64]
        item: freebsd-e1000
      - !managarm::arch_dep
        arch: [x86_64]
        item: lil
      - !managarm::arch_dep
        arch: [x86_64]
        item: nvidia-open
    revision: 3
    configure:
      - args: |
          sed -e 's|_BUILD_ROOT_|@BUILD_ROOT@|' -e 's|_SYSROOT_DIR_|@SYSROOT_DIR@|' @SOURCE_ROOT@/scripts/meson-clang-@OPTION:arch-triple@.cross-file \
              > ./meson-custom.cross-file
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file=./meson-custom.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nodownload'
        - '-Dbuild_drivers=true'
        - '-Dbuild_testsuite=true'
        - '@THIS_SOURCE_DIR@'
        environ:
          PKG_CONFIG_SYSROOT_DIR: '@BUILD_ROOT@/system-root'
          PKG_CONFIG_LIBDIR: '@BUILD_ROOT@/system-root/usr/lib/pkgconfig:@BUILD_ROOT@/system-root/usr/share/pkgconfig'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          'DESTDIR': '@THIS_COLLECT_DIR@'
        quiet: true
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '@THIS_COLLECT_DIR@']
      # Workaround for drivers that are not integrated into udev yet with systemd
      - args: ['mkdir', '-pv', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/sysinit.target.wants/']
      - args: ['ln', '-svn', '../runsvr-atkbd.service', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/sysinit.target.wants/']
      - args: ['ln', '-svn', '../runsvr-usbhid.service', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/sysinit.target.wants/']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/ci-boot.target.wants']
      - args: ['ln', '-svn', '../ci-boot.service', '@THIS_COLLECT_DIR@/usr/lib/systemd/system/ci-boot.target.wants/']
    tasks:
    - name: clang-tidy
      args:
      - 'run-clang-tidy'
      - '-config-file'
      - '@SOURCE_ROOT@/managarm/.clang-tidy'
      # suppress clang's "x warnings generated" spam
      - '-extra-arg=-fno-caret-diagnostics'
      - '-source-filter=^(?!@SOURCE_ROOT@/managarm/subprojects/)(?!@BUILD_ROOT@/system-root/usr/share/uacpi/)'
      - '-warnings-as-errors=*'
      - '-quiet'
      - '\.(h|c|cpp|hpp)$'
    - name: clang-tidy-autofix
      args:
      - 'run-clang-tidy'
      - '-config-file'
      - '@SOURCE_ROOT@/managarm/.clang-tidy'
      # suppress clang's "x warnings generated" spam
      - '-extra-arg=-fno-caret-diagnostics'
      - '-source-filter=^(?!@SOURCE_ROOT@/managarm/subprojects/)(?!@BUILD_ROOT@/system-root/usr/share/uacpi/)'
      - '-quiet'
      - '-fix'
      - '\.(h|c|cpp|hpp)$'
    scripts:
      post_install:
        - args: ['/usr/managarm/bin/update-boot.py', 'update-esp']

  - name: managarm-system-rs
    metadata:
      summary: The Managarm userspace (Rust components)
      description: This package provides the Rust components of the Managarm userspace.
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "48cf <me@iretq.dev>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    default: true
    from_source: managarm
    tools_required:
      - host-llvm-toolchain
      - host-managarm-tools
      - host-bragi
      - host-pkg-config
      - host-mold
      - host-cargo
      - host-rust
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    sources_required:
      - rust-patched-libs
    pkgs_required:
      - mlibc
      - uacpi
    revision: 6
    configure:
      # Managarm does not have a committed lockfile.
      # Delete any re-existing one such that cargo-inject-patches.py generates a fresh lockfile.
      - args: ['rm', '-f', '@THIS_SOURCE_DIR@/Cargo.lock']
      - args: ['@SOURCE_ROOT@/scripts/cargo-inject-patches.py', '@THIS_SOURCE_DIR@/Cargo.toml']
        isolate_network: false
    build:
      - args:
        - 'cargo'
        - 'build'
        - '--locked'
        - '--release'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--manifest-path'
        - '@THIS_SOURCE_DIR@/Cargo.toml'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
        isolate_network: false
        environ:
          # Required to build hel bindings
          CC: '@OPTION:arch@-managarm-gcc'
          # Required for uacpi-sys to locate the uacpi sources via pkg-config
          PKG_CONFIG: '@OPTION:arch-triple@-pkg-config'
          # Link the server binaries statically and don't touch SIGPIPE on startup
          RUSTFLAGS: "-C relocation-model=static -Z on-broken-pipe=inherit"
      - args: |
          mkdir -pv @THIS_COLLECT_DIR@/usr/bin
          mkdir -pv @THIS_COLLECT_DIR@/usr/lib/managarm/server

          # Find and copy all binaries built by this crate
          find @THIS_BUILD_DIR@/@OPTION:rust-arch@-unknown-managarm-mlibc/release/ -maxdepth 1 -type f -executable \
            -exec sh -c 'cp -pv "$1" "@THIS_COLLECT_DIR@/usr/bin/$(basename "$1")"' _ {} \;

          # Run bakesvr on all server binaries
          servers=""
          for x in ${servers}; do
            name=$(basename $x)
            bakesvr -o @THIS_COLLECT_DIR@/usr/lib/managarm/server/$name.bin @THIS_SOURCE_DIR@/$x/$name.yml
          done
    tasks:
    - name: cargo-check
      args:
        - 'cargo'
        - 'check'
        - '--release'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--manifest-path'
        - '@THIS_SOURCE_DIR@/Cargo.toml'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
      environ:
        # Required to build hel bindings
        CC: '@OPTION:arch@-managarm-gcc'
        # Required for uacpi-sys to locate the uacpi sources via pkg-config
        PKG_CONFIG: '@OPTION:arch-triple@-pkg-config'
        # Link the server binaries statically and don't touch SIGPIPE on startup
        RUSTFLAGS: "-C relocation-model=static -Z on-broken-pipe=inherit"
    - name: cargo-clippy
      args:
        - 'cargo'
        - 'clippy'
        - '--release'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--manifest-path'
        - '@THIS_SOURCE_DIR@/Cargo.toml'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
      environ:
        # Required to build hel bindings
        CC: '@OPTION:arch@-managarm-gcc'
        # Required for uacpi-sys to locate the uacpi sources via pkg-config
        PKG_CONFIG: '@OPTION:arch-triple@-pkg-config'
        # Link the server binaries statically and don't touch SIGPIPE on startup
        RUSTFLAGS: "-C relocation-model=static -Z on-broken-pipe=inherit"
    scripts:
      post_install:
        - args: ['/usr/managarm/bin/update-boot.py', 'update-esp']

  - name: midgard
    architecture: '@OPTION:arch@'
    metadata:
      summary: Lightweight Linux VMs on managarm
      description: This package provides midgard, which runs Linux in lightweight VMs on top of thor's virtualization API, and bifrost, its command-line interface.
      spdx: 'MIT'
      website: 'https://github.com/managarm/midgard'
      maintainer: "48cf <me@iretq.dev>"
      categories: ['app-emulation']
    source:
      subdir: 'ports'
      git: 'https://github.com/managarm/midgard.git'
      branch: 'master'
      rolling_version: true
      version: '0.0pl@ROLLING_ID@'
    tools_required:
      - host-llvm-toolchain
      # The managarm crate generates its protocol bindings with bragi.
      - host-bragi
      - host-cargo
      - host-rust
      - system-gcc
    sources_required:
      - managarm
      - rust-patched-libs
    pkgs_required:
      - mlibc
    revision: 1
    configure:
      # midgard's committed lockfile is the one of host builds: the patches (including the
      # one that points the Hel crates at the managarm checkout) are injected into a copy of
      # the lockfile (such that the source stays clean).
      - args: ['cp', '@THIS_SOURCE_DIR@/Cargo.lock', '@THIS_BUILD_DIR@/Cargo.lock']
      - args: ['@SOURCE_ROOT@/scripts/cargo-inject-patches.py', '--lockfile-path', '@THIS_BUILD_DIR@/Cargo.lock',
               '--cargo-config', '@THIS_BUILD_DIR@/.cargo/config.toml', '@THIS_SOURCE_DIR@/Cargo.toml']
        isolate_network: false
    build:
      - args:
        - 'cargo'
        - 'build'
        - '--locked'
        - '--release'
        - '-p'
        - 'midgard'
        - '-p'
        - 'bifrost'
        - '--target-dir'
        - '@THIS_BUILD_DIR@'
        - '--manifest-path'
        - '@THIS_SOURCE_DIR@/Cargo.toml'
        - '-Zunstable-options'
        - '--lockfile-path'
        - '@THIS_BUILD_DIR@/Cargo.lock'
        - '--target'
        - '@OPTION:rust-arch@-unknown-managarm-mlibc'
        - '-j@PARALLELISM@'
        isolate_network: false
        environ:
          # Required to build hel bindings
          CC: '@OPTION:arch@-managarm-gcc'
          RUSTFLAGS: "-C relocation-model=static -Z on-broken-pipe=inherit"
      - args: ['install', '-Dm755', '@THIS_BUILD_DIR@/@OPTION:rust-arch@-unknown-managarm-mlibc/release/midgard', '@THIS_COLLECT_DIR@/usr/bin/midgard']
      - args: ['install', '-Dm755', '@THIS_BUILD_DIR@/@OPTION:rust-arch@-unknown-managarm-mlibc/release/bifrost', '@THIS_COLLECT_DIR@/usr/bin/bifrost']
      # The units start midgard in the user's systemd instance on bifrost's first connection.
      - args: ['install', '-Dm644', '-t', '@THIS_COLLECT_DIR@/usr/lib/systemd/user',
               '@THIS_SOURCE_DIR@/crates/midgard/systemd/midgard.socket', '@THIS_SOURCE_DIR@/crates/midgard/systemd/midgard.service']
      - args: ['sh', '-c', 'echo "enable midgard.socket" > 80-midgard.preset']
      - args: ['install', '-Dm644', '80-midgard.preset', '@THIS_COLLECT_DIR@/usr/lib/systemd/user-preset/80-midgard.preset']
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: midgard-dbg
        include: ['/usr/lib/debug/**']
    scripts:
      post_install:
        # Preset only on the first installation, such that updates keep a user's choice.
        - args: '[ "$4" = yes ] || systemctl --global preset midgard.socket'

  - name: uacpi
    metadata:
      summary: A portable and easy-to-integrate implementation of the Advanced Configuration and Power Interface (ACPI).
      description: This package contains sources for uACPI which are used to provide ACPI support in Managarm.
      spdx: 'MIT'
      website: 'https://github.com/uACPI/uACPI/'
      maintainer: "no92 <leo@managarm.org>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    from_source: 'uacpi'
    revision: 1
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--prefix=/usr'
        - '-Dinstall_pkgconfig=true'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: vendor-devicetrees
    metadata:
      summary: Device trees for Managarm that are not part of mainline Linux
      description: This package contains device trees for Managarm to support boards that are not in mainline Linux.
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "Alexander van der Grinten <avdgrinten@managarm.org>"
      categories: ['sys-kernel']
    labels: [aarch64, riscv64]
    architecture: noarch
    default: true
    source:
      rolling_version: true
      version: '0.0pl@ROLLING_ID@'
      subdir: 'ports'
      git: 'https://github.com/managarm/vendor-devicetrees.git'
      branch: 'main'
    tools_required:
      - host-dtc
    revision: 2
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--prefix=/usr/managarm'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '--wrap-mode=nofallback'
        - '@THIS_SOURCE_DIR@'
        isolate_network: false
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
